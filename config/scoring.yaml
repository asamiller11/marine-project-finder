# Scoring rules for "likely needs marine habitat work" (0 to 100).
#
# How the score is built (see mpf/score.py):
#   1. Project type points: the best matching marine project type.
#   2. Habitat clue points: each clue group counts once, added up, capped.
#   3. Size points: from lengths, areas, dredge volumes, MW, slips.
#   4. Small-project penalty, and a cap when nothing marine is mentioned.
#
# Patterns are regular expressions, matched ignoring upper/lower case.
# Keep English and French together in the same list.
# Use single quotes so backslashes are kept as written.

flag_threshold: 40          # items at or above this score count as "flagged"

caps:
  habitat_points_max: 55
  size_points_max: 20
  # If the text never mentions a marine setting, the score cannot go above this.
  no_marine_context_max: 15

# Words that show the work is in or next to the sea or an estuary.
marine_context:
  - '\bmarine\b'
  - '\b(sea|ocean|oceanic)\b'
  - '\bharbou?r'
  - '\bestuar'
  - '\bintertidal|\bsubtidal|\btidal\b'
  - '\bcoast(al)?\b|\bshoreline\b|\bnearshore\b|\bforeshore\b'
  - '\b(bay|gulf|strait|sound|inlet|cove|fjord|fiord)\b'
  - '\bwharf|\bwharves\b|\bjetty|\bbreakwater'
  - '\bmarin(e|s)?\b|\bmer\b|\bocéan'
  - '\bhavre\b|\bportuaire|\bquai'
  - '\bestuaire|\blittoral|\bcôti(er|ère)|\bbaie\b|\bgolfe\b|\bfleuve\b'

project_types:
  port_terminal:
    points: 20
    label: "Port or marine terminal"
    patterns:
      # Not "port authority": that is usually the proponent's name, not the project.
      - '\bport (expansion|development|terminal|facility|facilities|extension)'
      - '\bmarine terminal|\bcontainer terminal|\bferry terminal|\bLNG (export )?terminal'
      # Not plain "berthing": small craft harbours use it for boat floats.
      - '\b(new|additional|deep[- ]water|deep[- ]sea) berths?\b|\bberth (expansion|extension|construction)'
      - '\binstallations? portuaires?|\bterminal maritime|\bagrandissement du port|\bport de\b'
  wharf_dock:
    points: 15
    label: "Wharf, pier or large dock"
    patterns:
      - '\bwharf|\bwharves\b'
      - '\bpier\b|\bpiers\b'
      - '\bdock(s|ing)?\b'
      - '\bquai(s)?\b'
      - '\bappontement|\bponton'
  breakwater_jetty:
    points: 20
    label: "Breakwater, jetty or groyne"
    patterns:
      - '\bbreakwater'
      - '\bjett(y|ies)\b'
      - '\bgroyne|\bgroin\b'
      - '\bbrise-lames?|\bjetée'
  dredging:
    points: 18
    label: "Dredging"
    patterns:
      - '\bdredg'
      - '\bdragage|\bdraguer'
      - '\bnavigation channel|\bapproach channel|\bturning basin'
  shoreline_protection:
    points: 12
    label: "Shoreline protection, seawall or bulkhead"
    patterns:
      - '\bseawall|\bsea wall'
      - '\bbulkhead'
      # Not plain "armour stone": quarries that produce it are not marine works.
      - '\brevetment|\briprap|\brip rap|\barmou?r ?stone (protection|placement|revetment)'
      - '\bshoreline protection|\bshore protection|\berosion protection|\bcoastal (protection|defen[cs]e|engineering)'
      - '\b(river|stream)?bank (protection|stabili[sz]ation)|\bprotect(ing)? the (river|stream)?bank|\bshoreline stabili[sz]ation|\bstabili[sz]ing .{0,40}shoreline'
      - '\benrochement|\bperré\b|\bmur de soutènement|\bprotection (des berges|du littoral|côtière|contre l.érosion)'
      - '\bstabilisation (des berges|de la berge|de la rive|du littoral|du talus)|\brecharge(ment)? de plage'
  marina_small_craft:
    points: 15
    label: "Marina or small craft harbour"
    patterns:
      # Not Spanish uses: "Ley de Puertos ... y de la Marina Mercante", "reserva marina", "fauna marina".
      - '(?<!fauna )(?<!flora )(?<!reserva )(?<!zona )(?<!costa )(?<!vida )(?<!eólica )(?<!de la )\bmarinas?\b(?!\s+(mercante|española|de|del)\b)'
      - '\bsmall craft harbou?r'
      - '\bboat (launch|ramp)'
      - '\bport de plaisance|\bhavre de pêche|\bport pour petits bateaux'
  infill_causeway:
    points: 15
    label: "Infill, reclamation or causeway"
    patterns:
      - '\binfill\b|\bin-fill\b'
      - '\bland reclamation|\breclaim(ed|ing)? land'
      - '\bcauseway'
      - '\bremblai|\bremblayage|\bchaussée'
  offshore_wind:
    points: 20
    label: "Offshore wind"
    patterns:
      - '\boffshore wind'
      - '\bwind turbine foundations?\b.{0,40}\b(seabed|offshore)'
      - '\bexport cable|\binter-array cable|\bsubsea cable|\bsubmarine cable'
      - '\béolien(ne)?s? en mer|\béolien(ne)?s? extracôti'
  outfall_intake:
    points: 8
    label: "Outfall or intake in the water"
    # Only when the project WORKS on the outfall or intake. A sentence that merely mentions
    # existing outfalls ("affected by drainage and wastewater outfalls") must not count.
    patterns:
      - '\b(new|replac\w*|rehabilitat\w*|upgrad\w*|construct\w*|install\w*|extend\w*|extension of|relocat\w*|repair\w*|rebuild\w*|stabili[sz]\w*)\b[^.;]{0,40}\b(outfall|water intake|intake structure|diffuser)'
      - '\b(outfall|water intake|intake structure|diffuser)s?\b[^.;]{0,30}\b(rehabilitation|replacement|extension|upgrade|construction|reconstruction|repair|relocat\w*|replaced|extended|installed)'
      - '\b(réfection|remplacement|prolongement|construction|réhabilitation|relocalisation|installation|stabilisation|nouvel(le)?)\b[^.;]{0,40}\b(émissaire|prise d.eau|exutoire)'
      - '\b(émissaire|prise d.eau|exutoire)s?\b[^.;]{0,30}\b(sera|seront)\s+(remplacé|prolongé|déplacé|reconstruit|réhabilité)'
  piles:
    points: 8
    label: "Piles or pile-supported structure"
    patterns:
      - '\bpile (driving|installation|replacement)|\bpiles\b|\bpiling\b'
      - '\bpieux\b|\bbattage de pieux'

# Habitat clues. Each group adds its points once, with the matching sentence as evidence.
habitat_clues:
  offsetting:
    points: 25
    label: "Habitat offsetting or compensation mentioned"
    patterns:
      - '\boffset(ting)? (plan|measures?|habitat)|\bhabitat offset|\bfish habitat offset'
      - '\bcompensat(ion|ory) (habitat|measures?|plan|for)'
      - '\bcompensation (de l.habitat|du poisson)|\bplan de compensation|\bmesures? (de )?compensatoires?'
  fisheries_act:
    points: 20
    label: "Fisheries Act authorization"
    patterns:
      - '\bFisheries Act (authori[sz]ation|paragraph|section 35)|\bparagraph 35\(2\)\(b\)|\bsection 35\(2\)'
      - '\bautorisation (en vertu de la|de la) Loi sur les pêches|\bLoi sur les pêches'
  hadd:
    points: 20
    label: "Harmful alteration, disruption or destruction of fish habitat"
    patterns:
      - '\bHADD\b|\bharmful alteration|\bdeath of fish|\bdestruction of fish habitat'
      - '\bdétérioration, (la )?destruction ou (la )?perturbation|\bperturbation de l.habitat'
  habitat_creation:
    points: 15
    label: "New habitat, enhancement or nature-inclusive design"
    patterns:
      - '\b(new|create|creating|creation of|development of new) (fish |marine )?habitat'
      - '\bhabitat (enhancement|creation|restoration|compensation)'
      - '\bnature[- ]inclusive|\beco-?engineer|\bliving shoreline|\becological (design|engineering)'
      - '\breef (balls?|units?)|\bartificial reef'
      - '\b(seagrass|eelgrass|oyster|saltmarsh|salt marsh|kelp|seaweed) (planting|restoration|reef|bed restoration)|\brestoration of (seagrass|eelgrass|oyster|saltmarsh|salt marsh)'
      - '\b(création|aménagement|amélioration) d.habitats?|\bhabitat du poisson.{0,40}(créé|aménagé)|\brécif artificiel'
  eelgrass:
    points: 15
    label: "Eelgrass or seagrass"
    patterns:
      - '\beelgrass|\bseagrass|\bzostera\b|\bsubmerged aquatic vegetation|\bSAV\b'
      - '\bzostère|\bherbiers?\b'
  fish_habitat:
    points: 10
    label: "Fish habitat"
    patterns:
      - '\bfish habitat'
      - '\bhabitats? du poisson|\bhabitat du poisson'
  shellfish_oyster:
    points: 8
    label: "Shellfish, oyster or mussel beds"
    patterns:
      - '\bshellfish|\boyster|\bmussel bed|\bclam bed|\bscallop'
      - '\bmollusques|\bhuîtr|\bmoules?\b|\bpétoncle'
  intertidal_marsh:
    points: 8
    label: "Intertidal zone, salt marsh or tidal wetland"
    patterns:
      - '\bintertidal|\bsalt ?marsh|\btidal (marsh|wetland|flat)|\bmudflat'
      - '\bzone intertidale|\bmarais salé|\bestran|\bbatture'
  species_at_risk:
    points: 8
    label: "Species at risk"
    patterns:
      - '\bspecies at risk|\bSARA\b|\bendangered|\bthreatened species|\bcritical habitat'
      - '\bespèces? en péril|\bLEP\b|\bhabitat essentiel|\bmenacée'
  marine_footprint:
    points: 8
    label: "Work below high water or footprint on the seabed"
    patterns:
      - '\bbelow (the )?(high water|HHWLT|high-water)|\bseabed|\bsea floor|\bseafloor|\bmarine footprint|\bsubtidal'
      - '\bfond marin|\bsous la ligne des hautes eaux|\blit du fleuve'
  scour_protection:
    points: 6
    label: "Scour or cable protection"
    patterns:
      - '\bscour protection|\bcable protection|\brock (placement|berm|dump)'
      - '\bprotection (contre l.affouillement|des câbles)'
  mitigation_general:
    points: 3
    label: "General mitigation language (weak signal)"
    patterns:
      - '\bavoid and minimi[sz]e|\bmitigation measures'
      - '\bmesures d.atténuation'

# Size clues. Units are converted to metres, square metres, cubic metres, MW.
size_points:
  length_m:      [[50, 8], [200, 15]]          # [threshold, points]: highest met wins
  area_m2:       [[1000, 8], [10000, 15]]
  volume_m3:     [[5000, 8], [50000, 15]]
  power_mw:      [[20, 8], [200, 15]]
  slips:         [[50, 6], [150, 12]]

small_project:
  # If the largest length found is below this and nothing else is large, apply the penalty.
  max_length_m: 30
  penalty: 10

# ---------------------------------------------------------------------------
# Rules in other languages (Danish, Norwegian, Dutch, Spanish). Generated into the groups
# above at load time by mpf/score.py. Every pattern here has a test in tests/test_languages.py.
language_patterns:
  marine_context:
    da: '\bhavn|\bkyst|\bfjord|\bhavet\b|\bhavbund|\bsøterritori|\bvadehav'
    "no": '\bhavn|\bkyst|\bfjord|\bsjø(en|bunn|bunnen|område|areal|arealer)?\b|\bfarlei'
    nl: '\bhaven|\bkust|\bzee\b|\bwaddenzee|\bzeehaven|\bvaargeul|\bnoordzee'
    es: '\bpuerto\b|\bportuari|\bcosta\b|\blitoral\b|\bmarin[oa]\b|\bbahía\b|\bdársena'
  project_types:
    port_terminal:
      da: '\bhavneudvidelse|\bny havn\b|\bhavneterminal|\bcontainerterminal'
      "no": '\bhavneutbygging|\bny havn\b|\bhavneterminal|\bcontainerterminal'
      nl: '\bhavenuitbreiding|\bnieuwe haven\b|\bhaventerminal|\bcontainerterminal'
      es: '\bampliación del puerto|\bnuevo puerto|\bterminal portuaria|\bterminal de contenedores'
    wharf_dock:
      da: '\bkaj(en|er|anlæg|anlægget)?\b|\banløbsbro|\bbådebro'
      "no": '\bkai(a|en|er|anlegg)?\b|\bbrygge(n|r)?\b'
      nl: '\bkade(muur|n)?\b|\bsteiger(s)?\b|\baanlegsteiger'
      es: '\bmuelle(s)?\b|\batraque|\bpantalán'
    breakwater_jetty:
      da: '\bmole(n|r)?\b|\bbølgebryder'
      "no": '\bmolo(en)?\b|\bbølgebryter'
      nl: '\bgolfbreker|\bhavendam'
      es: '\bdique de abrigo|\brompeolas|\bespigón'
    dredging:
      da: '\bopmudring|\buddybning|\bklapning'
      "no": '\bmudring|\butdyping'
      nl: '\bbaggeren|\bbaggerwerk|\bverdieping van de vaargeul'
      es: '\bdragado'
    shoreline_protection:
      da: '\bkystbeskyttelse|\bkystsikring|\bhøfde(r)?\b|\bsandfodring'
      "no": '\berosjonssikring|\bstrandsikring|\bplastring'
      nl: '\boeverbescherming|\bkustversterking|\bzandsuppletie|\bdijkversterking'
      es: '\bprotección costera|\bdefensa de costa|\bregeneración de (la )?playa|\baportación de arena'
    marina_small_craft:
      da: '\blystbådehavn|\bfiskerihavn'
      "no": '\bsmåbåthavn|\bgjestehavn|\bfiskerihavn'
      nl: '\bjachthaven|\bvissershaven'
      es: '\bpuerto deportivo|\bdársena deportiva|\bpuerto pesquero'
    infill_causeway:
      da: '\bopfyldning|\blandvinding|\binddæmning'
      "no": '\butfylling (i|av) sjø'
      nl: '\blandaanwinning|\bopspuiten'
      es: '\bganancia de terrenos al mar|\brelleno (portuario|en el mar)'
    offshore_wind:
      da: '\bhavvind|\bhavmøllepark|\bhavvindmøllepark'
      "no": '\bhavvind'
      nl: '\bwindpark op zee|\bwind op zee|\bwindenergie op zee'
      es: '\beólica marina|\bparque eólico marino|\beólica offshore'
    piles:
      da: '\bnedramning|\bspunsvæg|\bpæle\b'
      "no": '\bpeling\b|\bpeler\b'
      nl: '\bheipalen|\bdamwand'
      es: '\bpilotes\b|\bpilotaje|\btablestacas'
    outfall_intake:
      da: '\b(ny|nyt|etablering af|udskiftning af|forlængelse af)\b[^.;]{0,30}\b(udløbsledning|udledningsledning|vandindtag)'
      "no": '\b(ny|nytt|etablering av|utskifting av|forlengelse av)\b[^.;]{0,30}\b(utslippsledning|sjøvannsinntak)'
      nl: '\b(nieuwe|aanleg van|vervanging van|verlenging van)\b[^.;]{0,30}\b(lozingsleiding|uitlaatwerk|inlaatwerk)'
      es: '\b(nuevo|nueva|construcción de|sustitución de|prolongación de)\b[^.;]{0,30}\b(emisario|toma de agua)'
  habitat_clues:
    offsetting:
      da: '\bkompenserende foranstaltninger|\berstatningsnatur|\bnaturkompensation'
      "no": '\bkompenserende tiltak|\bkompensasjonstiltak'
      nl: '\bnatuurcompensatie|\bcompenserende maatregelen|\bcompensatie van natuur'
      es: '\bmedidas compensatorias|\bcompensación ambiental'
    habitat_creation:
      da: '\bnaturgenopretning|\bstenrev|\bnyt? habitat'
      "no": '\bkunstig rev|\brestaurering av natur|\bnye habitater'
      nl: '\bnatuurvriendelijke oever|\bnatuurinclusief|\bkunstmatig rif|\bnieuwe natuur'
      es: '\barrecife artificial|\brestauración de hábitats|\bcreación de hábitats'
    eelgrass:
      da: '\bålegræs'
      "no": '\bålegras|\btareskog'
      nl: '\bzeegras'
      es: '\bposidonia|\bpraderas marinas|\bfanerógamas marinas|\bcymodocea'
    fish_habitat:
      da: '\bgydeområde|\blevested(er)? for fisk|\bfiskeyngel'
      "no": '\bgyteområde|\bleveområde for fisk'
      nl: '\bpaaigebied|\bleefgebied voor vis|\bvismigratie'
      es: '\bhábitat de (los )?peces|\bzona de desove'
    shellfish_oyster:
      da: '\bmuslingebanke|\bøsters|\bblåmusling'
      "no": '\bskjellforekomst|\bøsters|\bblåskjell'
      nl: '\bmosselbank|\boesterbank|\bschelpdier'
      es: '\bbancos? de moluscos|\bostras?\b|\bmejillón|\bmarisqueo'
    intertidal_marsh:
      da: '\bvadehavet|\btidevandszone|\bstrandeng'
      "no": '\bfjæresone|\btidevannssone|\bstrandeng'
      nl: '\bwadden\b|\bkwelder|\bslikken\b|\bgetijdengebied'
      es: '\bzona intermareal|\bmarisma|\bhumedal costero'
    species_at_risk:
      da: '\bbilag IV|\bhabitatdirektiv|\bNatura 2000'
      "no": '\brødlist|\btruede arter'
      nl: '\bbeschermde soorten|\bNatura 2000'
      es: '\bRed Natura 2000|\bespecies protegidas|\bZEPA\b'
    marine_footprint:
      da: '\bhavbund(en)?\b'
      "no": '\bsjøbunn(en)?\b'
      nl: '\bzeebodem'
      es: '\bfondo marino|\blecho marino'
    scour_protection:
      da: '\berosionsbeskyttelse|\bkabelbeskyttelse'
      "no": '\berosjonsbeskyttelse|\bsteinfylling'
      nl: '\bbodembescherming|\bkabelbescherming|\bstortsteen'
      es: '\bprotección (anti)?socavación|\bprotección del cable'
    mitigation_general:
      da: '\bafværgeforanstaltninger'
      "no": '\bavbøtende tiltak'
      nl: '\bmitigerende maatregelen'
      es: '\bmedidas correctoras|\bmedidas preventivas y correctoras'
