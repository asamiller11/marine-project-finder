# Scoring rules for "likely needs marine habitat work" (0 to 100).
#
# How the score is built (see mpf/score.py):
#   1. Project type points: the best matching marine project type.
#   2. Habitat clue points: each clue group counts once, added up, capped.
#   3. Size points: from lengths, areas, dredge volumes, MW, slips.
#   4. Small-project penalty, and a cap when nothing marine is mentioned.
#
# Patterns are regular expressions, matched ignoring upper/lower case.
# Keep English and French together in the same list.
# Use single quotes so backslashes are kept as written.

flag_threshold: 40          # items at or above this score count as "flagged"

caps:
  habitat_points_max: 55
  size_points_max: 20
  # If the text never mentions a marine setting, the score cannot go above this.
  no_marine_context_max: 15
  # With no project type and no habitat clue, sizes alone cannot list a project (a 400 m trail is not marine work).
  size_only_max: 15

# Words that show the work is in or next to the sea or an estuary.
marine_context:
  - '\bmarine\b'
  - '\b(sea|ocean|oceanic)\b'
  - '\bharbou?r'
  - '\bestuar'
  - '\bintertidal|\bsubtidal|\btidal\b'
  - '\bcoast(al)?\b|\bshoreline\b|\bnearshore\b|\bforeshore\b'
  - '\b(bay|gulf|strait|sound|inlet|cove|fjord|fiord)\b'
  - '\bwharf|\bwharves\b|\bjetty|\bbreakwater|\bberths?\b'
  - '\bmarines?\b'
  - '(?#fr)\bmarins?\b|\bmer\b|\bocéan'
  - '(?#fr)\bhavre\b|\bportuaire|\bquai'
  - '(?#fr)\bestuaire|\blittoral|\bcôti(er|ère)|\bbaie\b|\bgolfe\b|\bfleuve\b'

project_types:
  port_terminal:
    points: 20
    label: "Port or marine terminal"
    patterns:
      # Not "port authority": that is usually the proponent's name, not the project.
      - '\bport (expansion|development|terminal|facility|facilities|extension)'
      - '\bmarine terminal|\bcontainer terminal|\bferry terminal|\bLNG (export )?terminal'
      # Not plain "berthing": small craft harbours use it for boat floats.
      - '\b(new|additional|deep[- ]water|deep[- ]sea) berths?\b|\bberth (expansion|extension|construction)'
      - '(?#fr)\binstallations? portuaires?|\bterminal maritime|\bagrandissement du port|\bport de\b'
  # A wharf, quay or berth being rebuilt or replaced: in-water structure work, so it counts a little more than a
  # plain mention of a wharf. When it matches, it replaces wharf_dock (the same structure is not counted twice).
  wharf_rebuild:
    points: 20
    label: "Wharf, pier or large dock"
    replaces: wharf_dock
    patterns:
      - '\b(reconstruct\w*|rebuild\w*|replac\w*|rehabilitat\w*)\b[^.;]{0,30}\b(wharf|wharves|quay|quays|berths?)\b'
      - '\b(wharf|wharves|quay|berths?)\b[^.;]{0,15}\b(reconstruction|replacement|rehabilitation|rebuild)\b'
      - '(?#fr)\b(reconstruction|réfection|remplacement|réhabilitation)\b[^.;]{0,20}\b(du|des|d.un) quais?\b'
  wharf_dock:
    points: 15
    label: "Wharf, pier or large dock"
    patterns:
      - '\bwharf|\bwharves\b'
      - '\bpier\b|\bpiers\b'
      - '\bdock(s|ing)?\b'
      - '(?#fr)\bquai(s)?\b'
      - '\bpontoons?\b'
      - '(?#fr)\bappontement|\bponton\b'
  breakwater_jetty:
    points: 20
    label: "Breakwater, jetty or groyne"
    patterns:
      - '\bbreakwater'
      - '\bjett(y|ies)\b'
      - '\bgroyne|\bgroin\b'
      - '(?#fr)\bbrise-lames?|\bjetée'
  dredging:
    points: 18
    label: "Dredging"
    patterns:
      - '\bdredg'
      - '(?#fr)\bdragage|\bdraguer'
      - '\bnavigation channel|\bapproach channel|\bturning basin'
  shoreline_protection:
    points: 12
    label: "Shoreline protection, seawall or bulkhead"
    patterns:
      - '\bseawall|\bsea wall'
      - '\bbulkhead'
      # Not plain "armour stone": quarries that produce it are not marine works.
      - '\brevetment|\briprap|\brip rap|\barmou?r ?stone (protection|placement|revetment)'
      - '\bshoreline protection|\bshore protection|\berosion protection|\bcoastal (protection|defen[cs]e|engineering)'
      - '\b(river|stream)?bank (protection|stabili[sz]ation)|\bprotect(ing)? the (river|stream)?bank|\bshoreline stabili[sz]ation|\bstabili[sz]ing .{0,40}shoreline'
      - '(?#fr)\benrochement|\bperré\b|\bmur de soutènement|\bprotection (des berges|du littoral|côtière|contre l.érosion)'
      - '(?#fr)\bstabilisation (des berges|de la berge|de la rive|du littoral|du talus)|\brecharge(ment)? de (la )?plage'
  marina_small_craft:
    points: 15
    label: "Marina or small craft harbour"
    patterns:
      # Not Spanish uses: "Ley de Puertos ... y de la Marina Mercante", "reserva marina", "fauna marina".
      - '(?<!fauna )(?<!flora )(?<!reserva )(?<!zona )(?<!costa )(?<!vida )(?<!eólica )(?<!de la )\bmarinas?\b(?!\s+(mercante|española|de|del)\b)'
      - '\bsmall craft harbou?r'
      - '\bboat (launch|ramp)'
      - '(?#fr)\bport de plaisance|\bhavre de pêche|\bport pour petits bateaux'
  infill_causeway:
    points: 15
    label: "Infill, reclamation or causeway"
    patterns:
      - '\binfill\b|\bin-fill\b'
      - '\bland reclamation|\breclaim(ed|ing)? land'
      - '\bcauseway'
      - '(?#fr)\bremblai|\bremblayage|\bchaussée'
  offshore_wind:
    points: 20
    label: "Offshore wind"
    patterns:
      - '\boffshore wind'
      - '\bwind turbine foundations?\b.{0,40}\b(seabed|offshore)'
      - '\bexport cable|\binter-array cable|\bsubsea cable|\bsubmarine cable'
      - '(?#fr)\béolien(ne)?s? en mer|\béolien(ne)?s? extracôti'
  outfall_intake:
    points: 8
    label: "Outfall or intake in the water"
    # Only when the project WORKS on the outfall or intake. A sentence that merely mentions
    # existing outfalls ("affected by drainage and wastewater outfalls") must not count.
    patterns:
      - '\b(new|replac\w*|rehabilitat\w*|upgrad\w*|construct\w*|install\w*|extend\w*|extension of|relocat\w*|repair\w*|rebuild\w*|stabili[sz]\w*)\b[^.;]{0,40}\b(outfall|water intake|intake structure|diffuser)'
      - '\b(outfall|water intake|intake structure|diffuser)s?\b[^.;]{0,30}\b(rehabilitation|replacement|extension|upgrade|construction|reconstruction|repair|relocat\w*|replaced|extended|installed)'
      - '(?#fr)\b(réfection|remplacement|prolongement|construction|réhabilitation|relocalisation|installation|stabilisation|nouvel(le)?)\b[^.;]{0,40}\b(émissaire|prise d.eau|exutoire)'
      - '(?#fr)\b(émissaire|prise d.eau|exutoire)s?\b[^.;]{0,30}\b(sera|seront)\s+(remplacé|prolongé|déplacé|reconstruit|réhabilité)'
  # Moorings are usually small (a buoy and a block), so they add a little but never list a project alone.
  # They count only when the notice names a structure larger than one float (several floats or pontoons,
  # a marina, berths, a wharf, terminal, quay, jetty, dolphins or breakwater), so one private dock float adds nothing.
  moorings:
    points: 8
    label: "Moorings"
    require_text: '\b(floats|pontoons|floating (docks|piers|breakwaters?|wave attenuators?)|marinas?|berths|slips|mooring (fields?|areas?|buoys)|wharf|wharves|terminals?|dolphins|cribs|quays?|jett(y|ies)|breakwaters?|pontons|quais?|brise-lames|appontements?)\b'
    patterns:
      - '\bmoorings?\b'
      - '\bmouillages?\b|\bcorps-morts?\b'
  piles:
    points: 8
    label: "Piles or pile-supported structure"
    patterns:
      - '\bpile (driving|installation|replacement)|\bpiles\b|\bpiling\b'
      - '(?#fr)\bpieux\b|\bbattage de pieux'

# Habitat clues. Each group adds its points once, with the matching sentence as evidence.
habitat_clues:
  offsetting:
    points: 25
    label: "Habitat offsetting or compensation mentioned"
    patterns:
      - '\boffset(ting)? (plan|measures?|habitat)|\bhabitat offset|\bfish habitat offset'
      - '\bcompensat(ion|ory) (habitat|measures?|plan|for)'
      - '(?#fr)\bcompensation (de l.habitat|du poisson)|\bplan de compensation|\bmesures? (de )?compensatoires?'
  fisheries_act:
    points: 20
    label: "Fisheries Act authorization"
    patterns:
      - '\bFisheries Act (authori[sz]ation|paragraph|section 35)|\bparagraph 35\(2\)\(b\)|\bsection 35\(2\)'
      - '(?#fr)\bautorisation (en vertu de la|de la) Loi sur les pêches|\bLoi sur les pêches'
  hadd:
    points: 20
    label: "Harmful alteration, disruption or destruction of fish habitat"
    patterns:
      - '\bHADD\b|\bharmful alteration|\bdeath of fish|\bdestruction of fish habitat'
      - '(?#fr)\bdétérioration, (la )?destruction ou (la )?perturbation|\bperturbation de l.habitat'
  habitat_creation:
    points: 15
    label: "New habitat, enhancement or nature-inclusive design"
    patterns:
      - '\b(new|create|creating|creation of|development of new) (fish |marine )?habitat'
      - '\bhabitat (enhancement|creation|restoration|compensation)'
      - '\bnature[- ]inclusive|\beco-?engineer|\bliving shoreline|\becological (design|engineering)'
      - '\breef (balls?|units?)|\bartificial reef'
      - '\b(seagrass|eelgrass|oyster|saltmarsh|salt marsh|kelp|seaweed) (planting|restoration|reef|bed restoration)|\brestoration of (seagrass|eelgrass|oyster|saltmarsh|salt marsh)'
      - '(?#fr)\b(création|aménagement|amélioration) d.habitats?|\bhabitat du poisson.{0,40}(créé|aménagé)|\brécif artificiel'
  eelgrass:
    points: 15
    label: "Eelgrass or seagrass"
    patterns:
      - '\beelgrass|\bseagrass|\bzostera\b|\bsubmerged aquatic vegetation|\bSAV\b'
      - '(?#fr)\bzostère|\bherbiers?\b'
  fish_habitat:
    points: 10
    label: "Fish habitat"
    patterns:
      - '\bfish habitat'
      - '\bhabitats? du poisson|\bhabitat du poisson'
  shellfish_oyster:
    points: 8
    label: "Shellfish, oyster or mussel beds"
    patterns:
      - '\bshellfish|\boyster|\bmussel bed|\bclam bed|\bscallop'
      - '(?#fr)\bmollusques|\bhuîtr|\bmoules?\b|\bpétoncle'
  intertidal_marsh:
    points: 8
    label: "Intertidal zone, salt marsh or tidal wetland"
    patterns:
      - '\bintertidal|\bsalt ?marsh|\btidal (marsh|wetland|flat)|\bmudflat'
      - '(?#fr)\bzone intertidale|\bmarais salé|\bestran|\bbatture'
  species_at_risk:
    points: 8
    label: "Species at risk"
    patterns:
      # "SARA" only as Canada's Species at Risk Act ("(SARA)", "SARA-listed", "under SARA"), not a name like "Sara".
      - '\bspecies at risk|\(SARA\)|\bSARA[- ](listed|schedule)|\bunder SARA\b|\bendangered|\bthreatened species|\bcritical habitat'
      - '(?#fr)\bespèces? en péril|\bLEP\b|\bhabitat essentiel|\bmenacée'
  marine_footprint:
    points: 8
    label: "Work below high water or footprint on the seabed"
    patterns:
      - '\bbelow (the )?(high water|HHWLT|high-water)|\bseabed|\bsea floor|\bseafloor|\bmarine footprint|\bsubtidal'
      - '(?#fr)\bfond marin|\bsous la ligne des hautes eaux|\blit du fleuve'
  scour_protection:
    points: 6
    label: "Scour or cable protection"
    patterns:
      - '\bscour protection|\bcable protection|\brock (placement|berm|dump)'
      - '\bprotection (contre l.affouillement|des câbles)'
  mitigation_general:
    points: 3
    label: "General mitigation language (weak signal)"
    patterns:
      - '\bavoid and minimi[sz]e|\bmitigation measures'
      - '(?#fr)\bmesures d.atténuation'

# Size clues. Units are converted to metres, square metres, cubic metres, MW.
size_points:
  length_m:      [[50, 8], [200, 15]]          # [threshold, points]: highest met wins
  area_m2:       [[1000, 8], [10000, 15]]
  volume_m3:     [[5000, 8], [50000, 15]]
  power_mw:      [[20, 8], [200, 15]]
  slips:         [[50, 6], [150, 12]]

small_project:
  # If the largest length found is below this and nothing else is large, apply the penalty.
  max_length_m: 30
  penalty: 10

# ---------------------------------------------------------------------------
# Rules in other languages (Danish, Norwegian, Dutch, Spanish). Generated into the groups
# above at load time by mpf/score.py. Every pattern here has a test in tests/test_languages.py.
language_patterns:
  marine_context:
    da: '\bhavn|\bkyst|\bfjord|\bhavet\b|\bhavbund|\bsøterritori|\bvadehav'
    "no": '\bhavn|\bkyst|\bfjord|\bsjø(en|bunn|bunnen|område|areal|arealer)?\b|\bfarlei'
    nl: '\bhaven|\bkust|\bzee\b|\bwaddenzee|\bzeehaven|\bvaargeul|\bnoordzee'
    es: '\bpuerto\b|\bportuari|\bcosta\b|\blitoral\b|\bmarin[oa]\b|\bbahía\b|\bdársena'
  project_types:
    port_terminal:
      da: '\bhavneudvidelse|\bny havn\b|\bhavneterminal|\bcontainerterminal'
      "no": '\bhavneutbygging|\bny havn\b|\bhavneterminal|\bcontainerterminal'
      nl: '\bhavenuitbreiding|\bnieuwe haven\b|\bhaventerminal|\bcontainerterminal'
      # Only building work. "Zona de la Ampliación del Puerto" is a place name and "Terminal de Contenedores de ..."
      # is usually a company name in port concession notices.
      es: '(?<!zona de la )\bampliación del puerto\b(?! de )|\bnuevo puerto\b|\b(constru\w*|amplia\w*|prolong\w*|repar\w*|rehabilit\w*|refuerz\w*|reforz\w*|reform\w*|nuev[oa]s?)\b[^.;]{0,40}\b(terminal portuaria|terminal de contenedores)\b'
    wharf_dock:
      da: '\bkaj(en|er|anlæg|anlægget)?\b|\banløbsbro|\bbådebro'
      "no": '\bkai(a|en|er|anlegg)?\b|\bbrygge(n|r)?\b'
      nl: '\bkade(muur|n)?\b|\bsteiger(s)?\b|\baanlegsteiger'
      # Only building work on a wharf. "muelle" alone is usually an address ("en el muelle de la Osa").
      es: '\b(constru\w*|amplia\w*|prolong\w*|repar\w*|rehabilit\w*|refuerz\w*|reforz\w*|reform\w*|nuev[oa]s?)\b[^.;]{0,40}\b(muelles?|pantal[aá]n(es)?|atraques?)\b'
    breakwater_jetty:
      da: '\bmole(n|r)?\b|\bbølgebryder'
      "no": '\bmolo(en)?\b|\bbølgebryter'
      nl: '\bgolfbreker|\bhavendam'
      # Only building work. "situados en el Espigón Central" or "junto al dique de abrigo" is an address.
      es: '\b(constru\w*|amplia\w*|prolong\w*|repar\w*|rehabilit\w*|refuerz\w*|reforz\w*|reform\w*|nuev[oa]s?)\b[^.;]{0,40}\b(diques?( de abrigo)?|rompeolas|espigon(es)?|espigón|escolleras?)\b'
    dredging:
      da: '\bopmudring|\buddybning|\bklapning'
      "no": '\bmudring|\butdyping'
      nl: '\bbaggeren|\bbaggerwerk|\bverdieping van de vaargeul'
      es: '\bdragado'
    shoreline_protection:
      da: '\bkystbeskyttelse|\bkystsikring|\bhøfde(r)?\b|\bsandfodring'
      "no": '\berosjonssikring|\bstrandsikring|\bplastring'
      nl: '\boeverbescherming|\bkustversterking|\bzandsuppletie|\bdijkversterking'
      es: '\bprotección costera|\bdefensa de costa|\bregeneración de (la )?playa|\baportación de arena'
    marina_small_craft:
      da: '\blystbådehavn|\bfiskerihavn'
      "no": '\bsmåbåthavn|\bgjestehavn|\bfiskerihavn'
      nl: '\bjachthaven|\bvissershaven'
      es: '\bpuerto deportivo|\bdársena deportiva|\bpuerto pesquero'
    infill_causeway:
      da: '\bopfyldning|\blandvinding|\binddæmning'
      "no": '\butfylling (i|av) sjø'
      nl: '\blandaanwinning|\bopspuiten'
      es: '\bganancia de terrenos al mar|\brelleno (portuario|en el mar)'
    offshore_wind:
      da: '\bhavvind|\bhavmøllepark|\bhavvindmøllepark'
      "no": '\bhavvind'
      nl: '\bwindpark op zee|\bwind op zee|\bwindenergie op zee'
      es: '\beólica marina|\bparque eólico marino|\beólica offshore'
    piles:
      da: '\bnedramning|\bspunsvæg|\bpæle\b'
      "no": '\bpeling\b|\bpeler\b'
      nl: '\bheipalen|\bdamwand'
      es: '\bpilotes\b|\bpilotaje|\btablestacas'
    outfall_intake:
      da: '\b(ny|nyt|etablering af|udskiftning af|forlængelse af)\b[^.;]{0,30}\b(udløbsledning|udledningsledning|vandindtag)'
      "no": '\b(ny|nytt|etablering av|utskifting av|forlengelse av)\b[^.;]{0,30}\b(utslippsledning|sjøvannsinntak)'
      nl: '\b(nieuwe|aanleg van|vervanging van|verlenging van)\b[^.;]{0,30}\b(lozingsleiding|uitlaatwerk|inlaatwerk)'
      es: '\b(nuevo|nueva|construcción de|sustitución de|prolongación de)\b[^.;]{0,30}\b(emisario|toma de agua)'
  habitat_clues:
    offsetting:
      da: '\bkompenserende foranstaltninger|\berstatningsnatur|\bnaturkompensation'
      "no": '\bkompenserende tiltak|\bkompensasjonstiltak'
      nl: '\bnatuurcompensatie|\bcompenserende maatregelen|\bcompensatie van natuur'
      es: '\bmedidas compensatorias|\bcompensación ambiental'
    habitat_creation:
      da: '\bnaturgenopretning|\bstenrev|\bnyt? habitat'
      "no": '\bkunstig rev|\brestaurering av natur|\bnye habitater'
      nl: '\bnatuurvriendelijke oever|\bnatuurinclusief|\bkunstmatig rif|\bnieuwe natuur'
      es: '\barrecife artificial|\brestauración de hábitats|\bcreación de hábitats'
    eelgrass:
      da: '\bålegræs'
      "no": '\bålegras|\btareskog'
      nl: '\bzeegras'
      es: '\bposidonia|\bpraderas marinas|\bfanerógamas marinas|\bcymodocea'
    fish_habitat:
      da: '\bgydeområde|\blevested(er)? for fisk|\bfiskeyngel'
      "no": '\bgyteområde|\bleveområde for fisk'
      nl: '\bpaaigebied|\bleefgebied voor vis|\bvismigratie'
      es: '\bhábitat de (los )?peces|\bzona de desove'
    shellfish_oyster:
      da: '\bmuslingebanke|\bøsters|\bblåmusling'
      "no": '\bskjellforekomst|\bøsters|\bblåskjell'
      nl: '\bmosselbank|\boesterbank|\bschelpdier'
      es: '\bbancos? de moluscos|\bostras?\b|\bmejillón|\bmarisqueo'
    intertidal_marsh:
      da: '\bvadehavet|\btidevandszone|\bstrandeng'
      "no": '\bfjæresone|\btidevannssone|\bstrandeng'
      nl: '\bwadden\b|\bkwelder|\bslikken\b|\bgetijdengebied'
      es: '\bzona intermareal|\bmarisma|\bhumedal costero'
    species_at_risk:
      da: '\bbilag IV|\bhabitatdirektiv|\bNatura 2000'
      "no": '\brødlist|\btruede arter'
      nl: '\bbeschermde soorten|\bNatura 2000'
      es: '\bRed Natura 2000|\bespecies protegidas|\bZEPA\b'
    marine_footprint:
      da: '\bhavbund(en)?\b'
      "no": '\bsjøbunn(en)?\b'
      nl: '\bzeebodem'
      es: '\bfondo marino|\blecho marino'
    scour_protection:
      da: '\berosionsbeskyttelse|\bkabelbeskyttelse'
      "no": '\berosjonsbeskyttelse|\bsteinfylling'
      nl: '\bbodembescherming|\bkabelbescherming|\bstortsteen'
      es: '\bprotección (anti)?socavación|\bprotección del cable'
    mitigation_general:
      da: '\bafværgeforanstaltninger'
      "no": '\bavbøtende tiltak'
      nl: '\bmitigerende maatregelen'
      es: '\bmedidas correctoras|\bmedidas preventivas y correctoras'

# ---------------------------------------------------------------------------
# FRESHWATER LABEL. A project is labelled "Freshwater" when the notice names a lake and nothing
# salt-water, or when it is in an inland province or territory and does not mention Hudson Bay or James Bay.
# The label is shown on every view; the hard-structure profile hides these projects unless the
# visitor ticks "Include freshwater".
freshwater:
  lake: '\b(?:Lake|Lac) [A-Z][\w''’-]+|\bGreat Lakes\b|\blakeshore\b'
  salt: '(?i)\b(?:sea|seas|ocean|oceans|marine|tidal|intertidal|subtidal|estuar\w*|saltwater|salt water|seawater|brackish|gulf|strait|fjord|atlantic|pacific|arctic|seabed|offshore|mer|océan|marin|marins)\b'
  # Agency names that contain salt-water words ("Fisheries and Oceans Canada") are ignored.
  ignore: '(?i)fisheries and oceans( canada)?|pêches et océans( canada)?'
  inland_regions: [Ontario, Manitoba, Saskatchewan, Alberta]
  inland_salt_exceptions: '(?i)hudson bay|james bay|churchill'

# MAINTENANCE DREDGING. A notice that only re-dredges an existing berth or channel (no new structure),
# under this volume and with no clear habitat words, is kept at Weak (34).
maintenance_dredging:
  pattern: '(?i)\bmaintenance dredg\w*|\bdragage d.entretien|\bdragado de mantenimiento'
  no_new_structure: '(?i)\b(?:does not|will not) (?:propose|include|involve) (?:any )?new (?:marine )?(?:infrastructure|structures?)|\bno new (?:marine )?(?:infrastructure|structures?)\b'
  max_volume_m3: 5000
  cap_score: 34
  habitat_words: [offsetting, fisheries_act, hadd, habitat_creation, eelgrass, shellfish_oyster, intertidal_marsh, species_at_risk]

# ---------------------------------------------------------------------------
# BUYER PROFILES. "All habitat work" is the general score above, unchanged. Each profile below
# re-weights the groups above (0 or left out = ignored) and adds its own keyword groups. Same tiers
# and cut-offs as the general score (Strong 60+, Possible 35-59, Weak 20-34), same size table and caps.
# A project is listed for a profile only if it matches at least one of the profile's "core" groups.
# A project that the general score does not list joins a profile only at Possible (35) or above.
# These are rule-based guesses. A flag never means mitigation is required.

profile_rules:
  # Stricter negation, used by profiles only. A keyword does not count when one of these comes
  # earlier in the same clause ("does not propose ... the existing wharf")...
  negation_before:
    - '\b(does|do|did|will|would|shall|is|are|was|were) not\b|\b(doesn|don|won|isn|aren|wasn|weren)[’'']t\b|\bnot (propose|include|involve|require|affect)'
    - '\bno (new|additional|in-water|marine)\b|\bwithout\b|\bneither\b'
    - '\bne\b[^.;:]{0,30}\bpas\b|\bn[’'']y aura pas|\baucun'
    - '\bikke\b|\bingen\b|\bniet\b|\bgeen\b|\bno se\b|\bsin\b'
  # ...or a condition word comes before it ("if required, riprap..."), or right after it.
  conditional_before:
    - '\bif\b|\bunless\b|\bin the event\b|\b(where|as) (required|necessary|needed)\b|\bshould\b[^.;:]{0,30}\b(be )?(required|needed|necessary)'
    - '\bsi\b|\ble cas échéant|\bau besoin'
    - '\bhvis\b|\bdersom\b|\bindien\b|\ben caso de\b|\bsi fuera\b'
  conditional_after:
    - '\b(if|where|when|as) (it is |they are )?(required|necessary|needed|warranted)\b'
    - '\bsi (nécessaire|requis|besoin)|\bau besoin\b|\ble cas échéant'
    - '\bom nødvendigt|\bved behov\b|\bhvis nødvendig|\bindien nodig|\bzo nodig|\ben caso necesario|\bsi fuera necesario'
  # A size read from a sentence about past or completed works is not counted ("approximately 4 km of
  # works ... completed between 2010 and 2025"). The largest remaining size is used instead.
  # A size written as a distance ("residences within 250 m of the site") is not the size of the works.
  doubtful_size_before: '\bwithin\s*$|\bà moins de\s*$|\bdans un rayon de\s*$'
  doubtful_size_sentence: '\b(completed|previously|already (built|constructed|completed)|(were|was|have been|has been) (built|constructed|completed|installed)|between (19|20)\d\d and (19|20)\d\d|since (19|20)\d\d|historic(al)?ly)\b|\bachevés?\b|\bdéjà (construit|réalisé)|\bréalisés? entre'

  # Small routine repairs (hard-structure profile): repair wording, every size found below all three
  # limits, and no clear habitat words -> kept at Weak (34). A notice with no size is not "small".
  routine_repair:
    max_length_m: 100
    max_area_m2: 2000
    max_volume_m3: 5000

profile_groups:
  bulkhead_marine:
    kind: type
    label: "Bulkhead (not at a dam, intake or river channel)"
    # Generating stations and dams have "bulkheads" (gates) that are not shoreline structures.
    exclude_sentence: '\b(dams?|generating station|power ?house|intake|spillway|sluice|penstock|lock|weir|river|channel|canal|barrage|centrale|écluse|déversoir|rivière)\b'
    en: '\bbulkhead'
  pier_marine:
    kind: type
    label: "Pier (not at a dam, intake or bridge)"
    # Dams, intakes and bridges have "piers" that are not marine structures.
    exclude_sentence: '\b(dams?|generating station|power ?house|intake|spillway|sluice|penstock|weir|bridges?|barrage|centrale|pont)\b'
    en: '\bpier\b|\bpiers\b'
  eco_units:
    label: "Eco-engineered or habitat-forming structure"
    en: '\beco-?concrete|\beco-?engineer|\bnature[- ]inclusive|\b(textured|habitat|ecological|bio-?enhancing) (panels?|units?|blocks?|armou?r|tiles?)|\breef (balls?|units?|modules?)|\bartificial reef|\btide ?pools?|\bliving (seawall|breakwater|dock)'
    fr: '\bbéton écologique|\brécif artificiel|\bgénie écologique|\bconception écologique'
    da: '\bstenrev|\bnaturinkluderende'
    "no": '\bkunstig rev|\bnaturinkluderende'
    nl: '\bnatuurinclusie\w*|\bnatuurvriendelijke oever|\bkunstmatig rif|\becologische (kade|dijk|oever)'
    es: '\barrecife artificial|\bhormigón ecológico|\becoingenier'
  armour_riprap:
    label: "Rock armour, riprap or armour units"
    en: '\briprap|\brip rap|\barmou?r ?(stone|rock|units?|layer)|\brock armou?r|\baccropodes?|\bcore-?locs?|\btetrapods?|\bxblocs?|\brock (revetment|berm)'
    fr: '\benrochements?|\bcarapace|\bblocs? de protection'
    da: '\bstenkastning|\bkastesten|\bstensætning'
    "no": '\bplastring|\bsteinfylling|\bsteinsetting'
    nl: '\bstortsteen|\bbreuksteen'
    es: '\bescolleras?|\bbloques de hormigón|\bmanto de (protección|bloques)'
  routine_repair:
    label: "Repair or replacement wording"
    en: '\b(repair|replace|replacement|rehabilitat|refurbish|maintenance|reconstruct|rebuild|resurfac|upgrade)\w*'
    fr: '\b(réfection|réparation|remplacement|entretien|réhabilitation|reconstruction)'
    da: '\b(renovering|istandsættelse|udskiftning|vedligehold|reparation)'
    "no": '\b(rehabilitering|istandsetting|utskifting|vedlikehold|reparasjon)'
    nl: '\b(herstel|vervanging|onderhoud|renovatie)'
    es: '\b(reparación|sustitución|rehabilitación|mantenimiento|reconstrucción)'
  living_shoreline:
    label: "Living shoreline, oyster reef or marsh restoration"
    en: '\bliving shorelines?|\bnature-based (solutions?|shoreline|coastal)|\b(oyster|shellfish) reefs?|\b(salt ?marsh|marsh|wetland) (restoration|creation|planting|enhancement)|\bsoft (shoreline|engineering)|\bcoir (logs?|rolls?)|\bbio-?engineering'
    fr: '\bgénie végétal|\brécifs? d.huîtres|\brestauration (du|des|de) marais|\bsolutions? fondées? sur la nature'
    da: '\bnaturbaserede? løsning|\bstrandeng\w*.{0,30}genopret'
    "no": '\bnaturbaserte? løsning'
    nl: '\bkwelderherstel|\bnatuurlijke oever|\boesterri[fj]|\bzachte (kust|oever)'
    es: '\barrecifes? de ostras|\brestauración de marismas|\bsoluciones basadas en la naturaleza'
  shellfish_works:
    label: "Shellfish work (reef, relocation, restoration or seeding)"
    # Shellfish counts as a core match only when the same sentence is about working on them, not when it
    # describes existing habitat ("the harbour supports fish, shellfish and other species").
    require_sentence: '\b(restor\w*|reefs?|relocat\w*|transplant\w*|plant\w*|seed\w*|enhanc\w*|creat\w*|cultch|spat|restaur\w*|réimplant\w*|ensemencement|genopret\w*|udsætning|utsetting|herstel\w*|restauración|siembra)\b'
    en: '\bshellfish|\boysters?\b|\bmussels?\b|\bclams?\b|\bscallops?\b'
    fr: '\bmollusques|\bhuîtr\w*|\bmoules\b|\bpétoncles?'
    da: '\bmuslinge\w*|\bøsters'
    "no": '\bskjell\w*|\bøsters'
    nl: '\bmossel\w*|\boester\w*|\bschelpdier\w*'
    es: '\bostras?\b|\bmejill\w*|\bmoluscos'
  erosion_control:
    label: "Erosion control works or shoreline stabilization"
    # Not plain "erosion control measures": that usually means silt fences during construction.
    en: '\berosion (control|protection) (blankets?|structures?|works|walls?|mats?)|\berosion protection\b(?! measures)|\b(shoreline|bank|slope|bluff) stabili[sz]ation|\bcoastal erosion|\bshoreline erosion'
    fr: '\bprotection contre l.érosion|\bstabilisation (des berges|de la berge|du talus|de la rive|du littoral)|\bérosion (côtière|des berges)'
    da: '\bkysterosion|\bkystsikring|\berosionssikring'
    "no": '\berosjonssikring|\bkysterosjon'
    nl: '\bkusterosie|\boevererosie|\boeverbescherming'
    es: '\berosión costera|\bcontrol de (la )?erosión|\bestabilización de (la )?(costa|ribera|playa)'
  seagrass_core:
    label: "Seagrass or eelgrass"
    # Narrower than the general eelgrass group, which also holds Norwegian "tareskog" (kelp forest)
    # and French "herbier" (any plant bed).
    en: '\beelgrass|\bseagrass|\bzostera\b|\bsurfgrass|\bphyllospadix|\bsubmerged aquatic vegetation'
    fr: '\bzostères?\b|\bherbiers? (de zostères|marins|aquatiques)'
    da: '\bålegræs'
    "no": '\bålegras|\bsjøgress'
    nl: '\bzeegras'
    es: '\bposidonia|\bpraderas? (marinas|de fanerógamas)|\bfanerógamas marinas|\bcymodocea|\bzostera'
  seagrass_work:
    label: "Seagrass survey, planting or restoration"
    en: '\b(eelgrass|seagrass|zostera)\b.{0,50}\b(transplant|restor|plant|survey|mapp|monitor|compensat|offset)|\b(transplant|restor|replant|plant)\w*\b.{0,40}\b(eelgrass|seagrass)'
    fr: '\bzostère\w*.{0,50}\b(transplant|restaur|inventaire|compensation)'
    da: '\bålegræs\w*.{0,50}(udplant|genopret|kortlæg|kompens)'
    "no": '\bålegras\w*.{0,50}(utplant|restaur|kartlegg|kompens)'
    nl: '\bzeegras\w*.{0,50}(aanplant|herstel|compensat)'
    es: '\bposidonia.{0,50}(trasplant|restaur|cartograf|compensa)'
  kelp_core:
    label: "Kelp or seaweed"
    # Whole words only: Danish "cykelprojekter" contains "kelp".
    en: '\bkelps?\b|\bseaweeds?\b|\bmacroalga\w*|\bnereocystis|\bmacrocystis|\blaminaria|\brockweed|\bascophyllum|\bfucoids?\b|\bsugar kelp'
    fr: '\balgues? (marines|brunes)|\blaminaires?\b|\bvarech|\bgoémon|\bmacroalgues?'
    da: '\btangskov|\bblæretang|\bsukkertang|\bmakroalger?|\bbrunalger?'
    "no": '\btareskog|\bstortare|\bsukkertare|\bgrisetang|\bmakroalger?'
    nl: '\bzeewier|\bkelp\b'
    es: '\balgas? (pardas|marinas)|\blaminarias?|\bmacroalgas?|\bbosques? de (algas|kelp)'
  kelp_work:
    label: "Kelp or seaweed restoration, or rocky reef"
    en: '\b(kelp|seaweed|macroalga\w*)\b.{0,40}\b(restor|transplant|plant|enhance|forest)|\brocky reef'
    fr: '\b(laminaires?|algues?)\b.{0,40}\b(restaur|transplant)|\brécif rocheux'
    da: '\btangskov\w*.{0,30}genopret|\bstenrev'
    "no": '\btareskog\w*.{0,30}(restaur|reetabler)'
    nl: '\bzeewier\w*.{0,30}herstel'
    es: '\bbosques? de algas.{0,30}restaur|\barrecife rocoso'
  coral_core:
    label: "Coral or coralline habitat"
    # Not place names such as Coral Harbour (Nunavut).
    en: '\bcorals?\b(?!\s+harbou?r)|\bcoralline|\bcold[- ]water corals?|\blophelia|\bsponge (reefs?|grounds?|aggregations?)'
    fr: '\bcorail|\bcoraux\b|\bcoralligène'
    da: '\bkoraller?\b'
    "no": '\bkorallrev|\bkoraller?\b|\blophelia'
    nl: '\bkoraal'
    es: '\bcorales?\b|\bcoralígen'
  banking_core:
    label: "Offsetting, compensation, credits or habitat banking"
    en: '\b(habitat|mitigation|conservation|offset) bank|\b(habitat|offset|offsetting|mitigation|biodiversity|compensation) credits?|\bbiodiversity net gain|\bno net loss|\b(habitat )?(offsetting|compensation) (plan|project|site|measures?)|\bcompensatory (habitat|measures?|mitigation)|\bhabitat offset|\bfish habitat offset'
    fr: '\bbanque (d.habitats?|de compensation)|\bcrédits? (d.habitat|de compensation)|\bplan de compensation|\bmesures? (de )?compensatoires?|\baucune perte nette|\bcompensation (de l.habitat|du poisson|écologique)'
    da: '\berstatningsnatur|\bnaturkompensation|\bkompenserende foranstaltninger|\bkompensationsareal'
    "no": '\bkompenserende tiltak|\bkompensasjonstiltak|\bnaturkompensasjon'
    nl: '\bnatuurcompensatie|\bcompenserende maatregelen|\bcompensatieopgave|\bcompensatiegebied'
    es: '\bbancos? de (hábitat|conservación|biodiversidad)|\bcompensación ambiental|\bmedidas compensatorias|\bcréditos? (de biodiversidad|ambientales)|\bpérdida neta (cero|nula)'

profiles:
  hard-structure:
    label: "Hard-structure eco-engineering"
    # Product makers: show the project stage instead of "Likely too late"; approved projects are leads.
    audience: product_maker
    exclude_freshwater: true
    # "West Dock berth", "Dock Road": a capitalised structure word that is part of a name is not a structure.
    group_rules: {wharf_dock: {exclude_names: true}}
    short: "Seawalls, bulkheads, piers, wharves, breakwaters, armouring and riprap, where eco-engineered units could replace plain concrete or rock."
    core: [breakwater_jetty, shoreline_protection, bulkhead_marine, wharf_dock, pier_marine, port_terminal, marina_small_craft, infill_causeway, piles, armour_riprap]
    # The general shoreline group's bulkhead pattern is replaced by bulkhead_marine (no dams or river channels).
    drop_patterns: {shoreline_protection: ['\bbulkhead'], wharf_dock: ['\bpier\b|\bpiers\b']}
    types: {breakwater_jetty: 25, shoreline_protection: 25, bulkhead_marine: 25, wharf_dock: 20, pier_marine: 20, port_terminal: 18,
            infill_causeway: 15, marina_small_craft: 12, piles: 10, offshore_wind: 10, outfall_intake: 5}
    clues: {eco_units: 20, armour_riprap: 12, habitat_creation: 15, offsetting: 12, fish_habitat: 8, hadd: 8,
            fisheries_act: 8, marine_footprint: 8, scour_protection: 8, intertidal_marsh: 5, species_at_risk: 4,
            eelgrass: 4, shellfish_oyster: 4, mitigation_general: 3}
    routine_repair_cap: true
    # Any of these found means the notice has clear habitat words, so the routine-repair cap does not apply.
    habitat_words: [eco_units, habitat_creation, offsetting, hadd, fisheries_act, fish_habitat, eelgrass,
                    shellfish_oyster, intertidal_marsh, species_at_risk]
  living-shoreline:
    label: "Living shoreline and shellfish"
    group_rules: {wharf_dock: {exclude_names: true}}
    short: "Oysters, mussels, salt marsh, shoreline stabilization and erosion control."
    core: [shellfish_works, intertidal_marsh, living_shoreline, erosion_control, shoreline_protection, bulkhead_marine]
    drop_patterns: {shoreline_protection: ['\bbulkhead'], wharf_dock: ['\bpier\b|\bpiers\b']}
    types: {shoreline_protection: 18, bulkhead_marine: 18, breakwater_jetty: 8, infill_causeway: 8, dredging: 6,
            marina_small_craft: 5, wharf_dock: 4, pier_marine: 4}
    clues: {living_shoreline: 30, shellfish_works: 20, intertidal_marsh: 18, erosion_control: 15, habitat_creation: 10,
            offsetting: 8, fish_habitat: 6, eelgrass: 6, shellfish_oyster: 4, species_at_risk: 4, marine_footprint: 4}
  seagrass:
    label: "Seagrass and eelgrass"
    short: "Eelgrass and seagrass beds: surveys, transplants, restoration and compensation."
    core: [seagrass_core]
    types: {dredging: 12, infill_causeway: 10, wharf_dock: 6, breakwater_jetty: 6, port_terminal: 6, marina_small_craft: 6,
            offshore_wind: 6, piles: 4, shoreline_protection: 4}
    clues: {seagrass_core: 30, seagrass_work: 15, habitat_creation: 8, offsetting: 8, hadd: 6, fisheries_act: 6,
            fish_habitat: 6, marine_footprint: 6, species_at_risk: 4}
  kelp:
    label: "Kelp and other seaweed"
    short: "Kelp forests, rockweed and other seaweed, and the rocky reefs they grow on."
    core: [kelp_core]
    types: {breakwater_jetty: 8, offshore_wind: 8, outfall_intake: 6, wharf_dock: 4, port_terminal: 4, dredging: 4,
            shoreline_protection: 4}
    clues: {kelp_core: 30, kelp_work: 15, habitat_creation: 8, offsetting: 8, fish_habitat: 6, marine_footprint: 6,
            species_at_risk: 4, scour_protection: 4}
  coral:
    label: "Coral"
    short: "Warm- and cold-water coral, coralline habitat and sponge reefs."
    core: [coral_core]
    types: {offshore_wind: 8, port_terminal: 6, dredging: 6, breakwater_jetty: 6, wharf_dock: 4, outfall_intake: 4}
    clues: {coral_core: 30, habitat_creation: 10, offsetting: 8, species_at_risk: 6, marine_footprint: 6, fish_habitat: 4}
  banking:
    label: "Mitigation banking and compensation"
    short: "Offsetting, compensation, credits, habitat banking and compensation plans."
    core: [banking_core, offsetting, hadd, fisheries_act]
    types: {infill_causeway: 8, dredging: 6, port_terminal: 6, breakwater_jetty: 6, offshore_wind: 6, wharf_dock: 4,
            shoreline_protection: 4, marina_small_craft: 4}
    clues: {banking_core: 30, offsetting: 20, hadd: 15, fisheries_act: 15, habitat_creation: 10, fish_habitat: 6,
            species_at_risk: 6, intertidal_marsh: 4, eelgrass: 4, shellfish_oyster: 4, marine_footprint: 6}

# Winnability (owner, 2026-11-19; mpf/winnability.py): points added to the relevance score, for the general list
# and every buyer profile, for how likely a project is to be winnable. It changes tiers, never who is listed: a
# listed project stays at least Weak, and one under the Weak line is not lifted onto a list.
winnability:
  stage:                      # earlier is better
    pre_application: 10
    open: 10                  # public comment period open
    assessment: 8             # under review
    closed: 4                 # comments closed, decision pending
    decided: -8               # approved
    under_construction: -15   # the notice says so, or an approved project's works window has started
    unknown: 0
  habitat_offsetting: 8       # offsetting, compensation, HADD or a Fisheries Act authorization is mentioned
  offset_groups: [offsetting, fisheries_act, hadd]
  engineering_firm: 6         # an engineering or environmental consultant is named
  construction_start:         # when the notice gives a start date
    within_months: 30
    soon: 6                   # starts within within_months
    later: 2                  # starts later than that
  large_size:                 # a size from a sentence about the marine works themselves
    length_m: 100
    area_m2: 5000
    volume_m3: 10000
    points: 4
  max_bonus: 25
  max_penalty: 15
