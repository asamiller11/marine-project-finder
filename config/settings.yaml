# General settings for MitiMark (formerly Marine Project Finder).
# Paths are relative to the project folder.

http:
  # Every request says who we are. Change the contact if you hand this to someone else.
  user_agent: "MarineProjectFinder/0.1 (research prototype; +https://github.com/asamiller11/marine-project-finder)"
  # Wait this long between requests to one host when robots.txt sets no crawl delay.
  default_delay_seconds: 3
  # Hosts that state a rate limit elsewhere (GDELT: "one every 5 seconds").
  host_delays:
    api.gdeltproject.org: 6
  # List pages (which change) are re-fetched at most this often.
  # Detail pages (one project) are fetched once and never again.
  list_page_max_age_hours: 20
  timeout_seconds: 60
  # We never request URLs that match these patterns, whatever robots.txt says.
  # DFO PATH (/arcgis/) stays off until DFO confirms scripts may use it.
  never_fetch:
    - "egisp.dfo-mpo.gc.ca"
    - "/arcgis/"
    - "donneesquebec.ca/recherche/api/"
    - "usace.army.mil"

data_dir: data          # cache, database and raw files live here (not in git)
drop_dir: drop          # put hand-saved PDF, HTML or text files here
labels_file: labels/labels.csv

# Source rule (README.md, docs/source_rules.md): a source whose robots.txt disallows automated reading may be
# read only if (a) the site owner has given written permission, or (b) its official terms or open-data licence
# explicitly invite automated access (for example a documented API or bulk download page). Never work around a
# 401, 403 or 429 or any block.
# To record an exception, add to that source's block (all three keys are required, or robots.txt applies):
#   robots_exception: {basis: b, hosts: ["data.example.org"], evidence: "terms URL and date checked"}
# No source uses an exception today.
sources:
  iaac:
    enabled: true
    # Besides the open comment list, also read the newest N project pages from the
    # registry sitemap, so we see recent projects whose comment period has closed.
    recent_projects: 150
  nl_ea:
    enabled: true
    # Only read projects registered in the last N days.
    lookback_days: 540
    # Also read the short "Summary of Registration" PDF when there is one.
    fetch_summary_pdf: true
    max_pdf_mb: 5
    # Also read the Minister's decision letter and the conditions of release, for projects whose own text names
    # a marine construction type. At most this many real requests per run; saved copies cost nothing.
    fetch_decision_docs: true
    max_decision_doc_requests: 30
  dfo_far:
    # Scorer test set only. All rows are issued authorizations from 2019-08 to 2023-06.
    enabled: true
    csv_url: "https://api-proxy.edh-cde.dfo-mpo.gc.ca/catalogue/records/2c09d2fd-9a8e-4d8c-b5af-95747e36eaac/attachments/fa-registry-dataset-ensemble-de-donnees-du-registre-de-lp_2023-06-21.csv"
  bc_eao:
    # OFF: the BC government copyright policy forbids reproducing its websites' content
    # "without the prior written permission of the Province of British Columbia".
    enabled: false
    # Keep projects that are still active, or had a comment period in the last N days.
    lookback_days: 730
  dk_hoering:
    enabled: true
    # Uses the default feed list in mpf/sources/dk_hoering.py (all hearings plus marine authorities).
  scot_marine:
    enabled: true
    # Each project page costs one request at a 10 second crawl delay, plus one for its first attached PDF.
    max_projects: 30
    fetch_pdf: true
    max_pdf_mb: 5
    # Notices about one project filed under different references, merged into one entry (newest notice kept).
    # A phrase matches any project name that contains it.
    same_project: ["ardersier port expansion"]
  es_boe:
    enabled: true
    # Read and scored every run, but not shown on the site: its notices are mostly port leases and licences,
    # not construction projects (audit 2026-11-12). Set to true to show it again.
    public: false
    lookback_days: 21
    max_items: 60
  fr_eolien:
    # OFF: eoliennesenmer.fr's legal notice forbids copying or publishing its content
    # "sans autorisation préalable et écrite du Cerema".
    enabled: false
    max_projects: 30
  fed_register:
    # US Federal Register API, NOAA Fisheries incidental harassment notices for pile driving at docks, wharves,
    # piers and terminals. Public domain; robots.txt allows /api/v1/ and /documents/full_text/. One request for the
    # list plus one per new notice (full text, fetched once). Shown only under the hard-structure profile.
    enabled: true
    term: '"incidental harassment authorization" pile driving'
    per_page: 10
  drop_folder:
    enabled: true

timing:
  # "Comment period closing soon" means the deadline is this many days away or fewer.
  closing_soon_days: 14
  # Mark "likely too late" when the decision date is this close or already past.
  too_late_days: 7

update:
  # The LaunchAgent runs an update when this many days have passed since the last uploaded one.
  days_between_updates: 7
  # At each update, re-read the project pages of listed projects that are not decided yet, if the saved
  # copy is older than this (hours). Same polite fetcher and delays.
  recheck_open_pages_hours: 144
  # When a source is blocked or fails during "Refresh everything and publish":
  #   false = publish the sources that worked, then warn (log and macOS notification)
  #   true  = stop without publishing anything
  stop_on_blocked_source: false

health:
  # The daily health check (python -m mpf health), run by its own LaunchAgent at this hour.
  hour: 9
  # Warn when the last uploaded update is older than update.days_between_updates plus this many days.
  grace_days: 1
  # Warn when a source returns less than this share of its usual number of notices.
  min_share_of_usual: 0.5
  # Projects that must stay on the live site while they are listed (a title phrase each).
  # Replace one when its project leaves the list for a normal reason.
  canaries: ["Port aux Basques", "Point Rousse", "Kings Bay"]

review:
  # Every scored item goes into review/review.csv. In the "publish" column:
  #   yes   = you checked it: shown with a "Reviewed by a person" badge
  #   no    = hidden everywhere
  #   blank = shown automatically with an "Automatic, not yet reviewed" badge
  file: review/review.csv

tiers:
  # Score thresholds. Below weak_min = "Probably not relevant".
  strong_min: 60
  possible_min: 35
  weak_min: 20
  # Titles matching these always go to "Probably not relevant" (quarries, pits, etc.).
  not_relevant_title_patterns:
    - '\bquarr(y|ies)\b'
    - '\b(gravel|sand|borrow) pit\b'
    - '\bpeat\b'
    - '\baggregate\b'
    # Hydroelectric stations and dams are not marine construction (tidal power is kept).
    - '^(?!.*\btidal\b).*\b(generating station|hydroelectric|hydro dam|powerhouse)\b'
    # Licences and documents that are not a construction project (Scotland): species licences, fish farms,
    # wind-farm safety zones, consultee comments. A species licence for a listed job is merged into that job.
    - '^(European Protected Species|Basking Shark)\b'
    - '\bmarine farm\b'
    - '\bsafety zone\b'
    - '^(consultee|consultation) (representations?|responses?|comments?)\b'

duplicates:
  # The same project listed by two sources is shown once. Keep the first source in this list.
  prefer: [nl_ea, iaac, drop]
  # How alike two titles must be (0 to 1) to count as the same project.
  min_title_similarity: 0.8

site:
  title: "MitiMark"
  description: "Early alerts on marine construction projects that may need habitat work"
  contact_name: "Asa Miller"
  contact_email: "asamiller11@gmail.com"
  update_frequency: "every week"
  # The public address, used for project page links in the CSV export.
  url: "https://asamiller11.github.io/marine-project-finder/"
  closing_soon_days: 30
  # Buyer feedback: a Google Form. Replace YOUR_FORM_ID with the form's id, and the entry number with the
  # form question that should hold the project id (from the form's "Get pre-filled link"). The site stores
  # nothing. While the placeholder is here, no feedback link is shown.
  feedback_form_url: "https://docs.google.com/forms/d/e/YOUR_FORM_ID/viewform"
  feedback_form_project_field: "entry.0000000000"
  # The "10 projects" shortlist page (shortlist.html) for the buyer test.
  shortlist_profile: hard-structure
  shortlist_size: 10
  # Quotes are whole sentences copied exactly from the notice, never cut. Longer sentences are skipped.
  max_quote_chars: 300
  max_quotes: 3
  # A quote must be about the project itself: it needs at least one of these words.
  quote_project_words: ['project', 'proposed', 'proposes', 'proponent', 'will', 'would', 'works?', 'construction',
                        'construct', 'planned', 'includes?', 'install', 'build', 'undertaking', 'development',
                        'projet', 'proposé', 'promoteur', 'travaux', 'sera', 'seront', 'prévoit', 'aménagement',
                        'projekt', 'anlæg', 'etablering', 'vil blive', 'udvidelse', 'prosjekt', 'tiltak', 'vil bli', 'utbygging', 'aanleg', 'wordt', 'uitbreiding', 'proyecto', 'obras', 'construcción', 'ampliación', 'consiste', 'se pretende', 'parc', 'éoliennes', 'éolien']
  # Sentences with these habitat words are preferred (they count three times).
  quote_habitat_words: ['fish habitat', 'offset', 'compensat', 'eelgrass', 'seagrass', 'shellfish', 'intertidal',
                        'salt marsh', 'new habitat', 'habitat creation', 'habitat enhancement', 'species at risk',
                        'habitat du poisson', 'compensation', 'zostère', 'mollusques', 'zone intertidale', 'herbier',
                        'ålegræs', 'ålegras', 'zeegras', 'posidonia', 'praderas', 'muslingebanke', 'mosselbank', 'bancos de moluscos', 'vadehav', 'wadden', 'zona intermareal', 'marisma', 'kompenserende', 'natuurcompensatie', 'medidas compensatorias', 'stenrev', 'arrecife artificial', 'Natura 2000', 'biodiversité', 'habitats marins']
  sources:
    - name: "Canadian Impact Assessment Registry"
      url: "https://iaac-aeic.gc.ca/050/evaluations"
      key: iaac
    - name: "Newfoundland and Labrador environmental assessment"
      url: "https://www.gov.nl.ca/eccc/env-assessment/projects-list/"
      key: nl_ea

llm:
  # Optional. Needs ANTHROPIC_API_KEY in your environment. The rule score stays primary.
  enabled: false
  model: "claude-opus-5-5"
  # Only summarize items at or above this rule score, to keep cost down.
  min_score: 40

# News signals (early warning, unverified). OFF. Nothing here runs or appears on the site unless
# BOTH switches below are turned on. Only headline, source name, date and link would be stored.
# Each feed was checked first: robots.txt allows it and its terms allow this use (see mpf/news.py).
# GDELT is not listed: it refused our requests (HTTP 429), and we do not contact it.
news:
  enabled: false           # true = read the feeds during ingest
  show_on_site: false      # true (and enabled) = show the "News signal, unverified" section
  default_shown: 15        # how many news items show before "Show all"
  max_age_days: 60
  feeds:
    - name: canada_dfo
      type: atom
      source_name: "Fisheries and Oceans Canada news (Canada.ca)"
      url: "https://api.io.canada.ca/io-server/gc/news/en/v2?dept=fisheriesoceans&sort=publishedDate&orderBy=desc&pick=50&format=atom"
    - name: canada_iaac
      type: atom
      source_name: "Impact Assessment Agency of Canada news (Canada.ca)"
      url: "https://api.io.canada.ca/io-server/gc/news/en/v2?dept=impactassessmentagency&sort=publishedDate&orderBy=desc&pick=50&format=atom"
    - name: govuk_mmo
      type: atom
      source_name: "Marine Management Organisation news (GOV.UK)"
      url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=marine-management-organisation"
